<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARS Poker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090b12;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: linear-gradient(180deg, #111522, #080a10);
      padding-bottom: 80px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 18px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #f4c95d;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f0d36b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b3a12;
      font-weight: bold;
    }

    .balance {
      margin: 10px 18px;
      padding: 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1b2030, #111522);
      border: 1px solid #30364a;
    }

    .balance-title {
      color: #8d95aa;
      font-size: 14px;
    }

    .balance-money {
      margin-top: 8px;
      font-size: 30px;
      font-weight: bold;
    }

    .telegram {
      margin: 16px 18px;
      padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #29204b, #17142c);
      border: 1px solid #493b73;
    }

    .telegram strong {
      color: #d7b95e;
    }

    .section {
      padding: 20px 18px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    .table-card {
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, #211a3c, #121626);
      border: 1px solid #3e3560;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .table-card:active {
      transform: scale(.98);
    }

    .table-name {
      font-size: 18px;
      font-weight: bold;
    }

    .table-info {
      margin-top: 8px;
      color: #9ea5b8;
      font-size: 14px;
    }

    .play {
      margin-top: 14px;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #d6b552;
      color: #111;
      font-weight: bold;
      font-size: 16px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, 100%);
      height: 70px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #10131c;
      border-top: 1px solid #292e3d;
    }

    .nav {
      color: #777f94;
      text-align: center;
      font-size: 12px;
    }

    .nav.active {
      color: #f1ca5d;
    }

    .nav-icon {
      font-size: 22px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top">
      <div class="logo">STARS</div>
      <div class="profile">Z</div>
    </div>

    <div class="balance">
      <div class="balance-title">PLAY MONEY BALANCE</div>
      <div class="balance-money">10,000,000</div>
    </div>

    <div class="telegram">
      ⭐ <strong>STARS POKER</strong>
      <p style="margin-top:8px;color:#a8aec0;">
        Play-money poker room
      </p>
    </div>

    <div class="section">
      <h2>♠ Cash Tables</h2>

      <div class="table-card" onclick="openTable('Malahit 6')">
        <div class="table-name">Malahit 6</div>
        <div class="table-info">
          Omaha Pot Limit · 2,500 / 5,000
        </div>
        <div class="table-info">
          👥 9 / 9 players
        </div>
      </div>

      <div class="table-card" onclick="openTable('Opal 7')">
        <div class="table-name">Opal 7</div>
        <div class="table-info">
          Omaha Pot Limit · 1,000 / 2,000
        </div>
        <div class="table-info">
          👥 6 / 9 players
        </div>
      </div>

      <button class="play" onclick="openTable('Malahit 6')">
        JOIN TABLE
      </button>
    </div>

  </div>

  <div class="bottom">
    <div class="nav active">
      <div class="nav-icon">⌂</div>
      Home
    </div>

    <div class="nav">
      <div class="nav-icon">💰</div>
      Wallet
    </div>

    <div class="nav">
      <div class="nav-icon">♠</div>
      Tables
    </div>

    <div class="nav">
      <div class="nav-icon">☰</div>
      Menu
    </div>
  </div>

  <script>
    function openTable(name) {
      alert(
        name +
        " ширээ рүү орох хэсэг дараагийн алхамд хийгдэнэ."
      );
    }
  </script>

</body>
  </html>
